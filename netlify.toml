[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Old draft URLs → password-protected /preview/ equivalents
[[redirects]]
  from = "/about.html"
  to = "/preview/about.html"
  status = 301

