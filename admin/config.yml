backend:
  name: git-gateway
  branch: main

# Where uploaded images land by default, unless a field overrides it below
media_folder: "images/uploads"
public_folder: "images/uploads"

collections:

  # ---------- SHOW RESULTS ----------
  # One JSON file containing a list of all show entries. Each list item
  # becomes one card on the Show Results page, newest date shown first
  # automatically (no need to reorder manually).
  - name: "show_results"
    label: "Show Results"
    files:
      - name: "results"
        label: "Show Results List"
        file: "data/show-results.json"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            summary: "{{fields.date}} — {{fields.show}}"
            fields:
              - { label: "Special milestone? (adds a gold highlight banner)", name: "milestone", widget: "boolean", default: false }
              - { label: "Milestone banner text", name: "milestoneLabel", widget: "string", required: false, hint: "Only shows if the box above is checked. e.g. ★ Danish Show Champion ★" }
              - { label: "Placement / Result", name: "placement", widget: "string", hint: "e.g. Best in Breed (BIR), Swedish Show Certificate & CACIB" }
              - { label: "Show name", name: "show", widget: "string", hint: "e.g. Swedish Kennel Club International Show — Boden" }
              - { label: "Date (as shown on the page)", name: "date", widget: "string", hint: "e.g. 30 May 2026" }
              - { label: "Date (for sorting)", name: "sortDate", widget: "date", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", hint: "Pick the actual date — this controls the order entries appear in" }
              - { label: "Class (optional)", name: "class", widget: "string", required: false, hint: "e.g. Junior Class, or Puppy Class 6-9 months" }
              - { label: "Description", name: "description", widget: "text", hint: "You can use **bold** around a word or phrase for emphasis" }
              - label: "Photos"
                name: "images"
                widget: "list"
                summary: "{{fields.alt}}"
                fields:
                  - { label: "Photo", name: "src", widget: "image", media_folder: "/images/show-results", public_folder: "/images/show-results" }
                  - { label: "Describe this photo (for accessibility)", name: "alt", widget: "string" }
              - { label: "Extra banner image (optional, e.g. a celebration graphic)", name: "bannerImage", widget: "image", required: false, media_folder: "/images", public_folder: "/images" }
              - { label: "Banner image description", name: "bannerImageAlt", widget: "string", required: false }

  # ---------- PUPPIES PAGE ----------
  - name: "puppies_page"
    label: "Puppies Page"
    files:
      - name: "puppies"
        label: "Puppies Page Content"
        file: "data/puppies.json"
        fields:
          - { label: "Hero subtitle (below the 'Puppies' heading)", name: "heroLede", widget: "text" }
          - { label: "Status label (small text above the heading)", name: "statusEyebrow", widget: "string" }
          - { label: "Status heading", name: "statusHeading", widget: "string" }
          - { label: "Status paragraph", name: "statusParagraph", widget: "text" }

  # ---------- HOMEPAGE ----------
  - name: "homepage"
    label: "Homepage"
    files:
      - name: "homepage"
        label: "Homepage Content"
        file: "data/homepage.json"
        fields:
          - { label: "Hero heading — line 1", name: "heroHeadingLine1", widget: "string" }
          - { label: "Hero heading — line 2", name: "heroHeadingLine2", widget: "string" }
          - { label: "Hero subtitle", name: "heroLede", widget: "text" }
          - { label: "\"Our Promise\" heading", name: "promiseHeading", widget: "string" }
          - { label: "\"Our Promise\" paragraph", name: "promiseParagraph", widget: "text" }
          - { label: "Ethos quote", name: "ethosQuote", widget: "string", hint: "Include the quotation marks if you want them shown" }
